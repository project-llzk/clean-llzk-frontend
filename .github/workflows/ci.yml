name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check workflow dependency pins
        run: bash scripts/llzk/check-actions-pinned.sh
      - name: Check for consecutive empty lines
        run: python3 scripts/check-consecutive-empty-lines.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build-args: "--wfail"
      - name: Build tests
        run: lake build CleanTests

  # The LLZK gates that need no LLZK toolchain: G0 (pins and provenance), G11
  # (the harness's own error paths) and G12 (confinement). Kept separate from
  # llzk-e2e so that a Nix or LLZK-build problem cannot take them down with it --
  # these three are pure git, grep and bash, and should never be flaky.
  #
  # Until R5, none of the LLZK gates ran in CI at all: `lake build CleanTests`
  # carries G1, G2, G8 and G9, and everything else was local-only (R5e-7).
  llzk-harness:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # check-pins.sh verifies HEAD descends from the pinned Clean base.
          fetch-depth: 0
      - name: Declare the upstream remote
        # A fresh checkout has `origin` only; G0 checks provenance against
        # `upstream`, which is exactly the state its first error path describes.
        run: git remote add upstream git@github.com:Verified-zkEVM/clean.git
      - name: G0 — state and pins
        run: bash scripts/llzk/check-pins.sh
      - name: G11 — harness error paths
        run: bash scripts/llzk/test-scripts.sh
      - name: G12 — confinement
        run: bash scripts/llzk/check-confinement.sh

  # The gates that need the pinned LLZK 3.0.0: G3, G4, G5, G6, G7 and G10. The
  # toolchain comes from the same flake reference doc/llzk/PINS.md records, so CI
  # and a local run are the same binaries by construction rather than by
  # convention.
  llzk-e2e:
    runs-on: ubuntu-24.04
    needs: build

    # `e2e.sh` requires the worktree lock. CI claims it rather than being
    # exempted from it: an exemption needs a predicate for "no contention here",
    # and every predicate available — no tty, non-interactive, CI=true — is also
    # true of the agent sessions on the development machine that collided three
    # times in one day, so a mis-set exemption would be invisible and green. A
    # claim step has no predicate, runs the same code a developer runs, and on a
    # fresh ephemeral checkout always succeeds. doc/llzk/CONCURRENCY.md.
    #
    # The identity has to be set explicitly because each `run:` block is a fresh
    # shell, and therefore a fresh POSIX session, so the default identity would
    # not survive from the claim step to the gate step. Job-level env reaches
    # both.
    env:
      LLZK_SESSION: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Declare the upstream remote
        run: git remote add upstream git@github.com:Verified-zkEVM/clean.git
      - name: Claim the worktree
        run: bash scripts/llzk/worktree-lock.sh claim "CI llzk-e2e"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://veridise-public.cachix.org
            extra-trusted-public-keys = veridise-public.cachix.org-1:FvpZ8GzAj1mmJA5PnO9UgKxC6CQdmPutuIKtEpGmeig=
      - name: Build the pinned LLZK
        id: llzk
        run: |
          out="$(nix build --no-link --max-jobs 0 --print-out-paths \
            'github:project-llzk/llzk-lib/5db6f8f9baaa40787a1a40625796497445f2da36#llzk')"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
          "${out}/bin/llzk-opt" --version
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build-args: "--wfail"
      - name: G0–G12 — the whole pipeline
        env:
          LLZK_OPT: ${{ steps.llzk.outputs.path }}/bin/llzk-opt
          LLZK_WITGEN: ${{ steps.llzk.outputs.path }}/bin/llzk-witgen
        run: bash scripts/llzk/e2e.sh

  plonky3-backend:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          # Cache Lean build for trace generation
          use-mathlib-cache: false
      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.0
      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/plonky3/target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('backends/plonky3/Cargo.lock') }}
      - name: Run plonky3 tests
        working-directory: backends/plonky3
        run: |
          cargo test --release -- --nocapture test_lean_circuit_end_to_end
          cargo test test_tampered_multiplicity
          cargo test --release test_tampered_multiplicity
          cargo test --release -- --nocapture test_femtocairo
